# HireSense AI — Skill Taxonomy v0
#
# version:      0.1
# created:      2026-11-17
# source:       seed จากความรู้สายงาน (ยังไม่ได้ขุดจากข้อมูลจริง)
# next:         v1 = ขุดคำศัพท์จาก Mehyaar (MIT) + Kaggle (CC0) ตาม 02-dataset-strategy.md §10
# coverage:     ⚠️ ยังไม่วัด — จะวัด OOV rate หลัง pilot annotation
#
# ────────────────────────────────────────────────────────────────────────
# กฎแยก alias ออกจาก related (03-annotation-guidelines.md §4.2):
#
#   ถ้า resume เอ่ยถึง X เท่านั้น เราพูดได้ไหมว่าผู้สมัคร "ระบุ" Y ไว้?
#     ได้     → alias   (X กับ Y คือสิ่งเดียวกัน แทนกันได้)
#     ไม่ได้  → related (เกี่ยวข้องกัน แต่เป็นทักษะต่างตัว)
#
#   ตัวอย่าง: pandas → python คือ related ไม่ใช่ alias
#             การสรุปว่า "มี python เพราะมี pandas" เป็นการอนุมาน
#             ซึ่งระบบต้องติดธง inferred: true และห้ามนับใน extraction F1
# ────────────────────────────────────────────────────────────────────────
#
# schema ของแต่ละรายการ:
#   id         : canonical id ที่ระบบใช้ภายใน (snake_case, ไม่เปลี่ยนตลอดอายุเวอร์ชัน)
#   canonical  : รูปที่แสดงให้คนอ่าน
#   category   : language | framework | library | tool | platform | database | concept | soft
#   aliases    : คำที่หมายถึงสิ่งเดียวกัน (ใส่เฉพาะที่จำเป็น)
#   related    : ทักษะที่เกี่ยวข้องแต่เป็นคนละตัว (ใส่เฉพาะที่ความสัมพันธ์ชัด)
#   match      : ใส่เฉพาะกรณีที่การจับคำต้องมีเงื่อนไข
#       requires_context: skills_section | adjacent_tech | uppercase_exact
#   notes      : เหตุผลการตัดสินใจ — สำหรับคำกำกวมโดยเฉพาะ
#   context_aliases : (เพิ่มใน 0.1) alias ที่นับได้เฉพาะเมื่อมีบริบท เช่นอยู่ในหัวข้อ Skills
#                     หรืออยู่ติดกับ token เทคนิค · ใช้กับคำที่เป็นคำภาษาอังกฤษทั่วไปด้วย
#                     ("excel at", "spark interest") · ไม่คุมชื่อเต็มของทักษะนั้น
#
# ────────────────────────────────────────────────────────────────────────
# CHANGELOG
#
# 0.1 (2026-11-24) — เพิ่มชื่อสั้นที่ขาด · พบตอนเขียน smoke set: resume จริงเขียน
#   "Airflow" "Excel" แทบทุกใบ แต่ v0 นับได้แค่ "Apache Airflow" "Microsoft Excel"
#   + aliases          : airflow kafka hadoop vue tailwind azure s3 ec2
#   + context_aliases  : excel spark express   (เป็นคำกริยาภาษาอังกฤษด้วย)
#   ไม่เพิ่มโดยเจตนา  : next (คำทั่วไป) · lambda (ชน lambda function) · sheets (คำทั่วไป)
#   ไม่มีการลบหรือเปลี่ยน id ใด ๆ · job ทั้ง 6 ยังอ้าง id เดิมได้ครบ
#
# 0   (2026-11-17) — seed จากความรู้สายงาน 104 ทักษะ

taxonomy_version: "0.1"

skills:

  # ═══════════════════════════════════════════════════════
  # LANGUAGES
  # ═══════════════════════════════════════════════════════

  - id: python
    canonical: Python
    category: language
    aliases: [python3, "python 3", "python programming"]
    related: [pandas, numpy, fastapi, django, flask, scikit_learn]

  - id: javascript
    canonical: JavaScript
    category: language
    aliases: [ecmascript, "java script"]
    related: [typescript, react, nodejs]
    # "JS" แยกเป็นรายการของตัวเองด้านล่าง เพราะต้องมีเงื่อนไขบริบท

  - id: typescript
    canonical: TypeScript
    category: language
    aliases: [ts]
    related: [javascript, react, nestjs]
    match:
      requires_context: [skills_section, adjacent_tech]
      notes: "'ts' ชนกับคำย่ออื่นได้ ต้องมีบริบท"

  - id: sql
    canonical: SQL
    category: language
    aliases: ["structured query language"]
    related: [postgresql, mysql, sql_server, bigquery]
    notes: >
      SQL Server / MySQL / PostgreSQL เป็นทักษะต่างตัว ไม่ใช่ alias ของ sql
      ผู้ที่เขียนว่า "SQL Server" ให้ label sql_server ไม่ใช่ sql

  - id: java
    canonical: Java
    category: language
    related: [spring_boot]
    match:
      word_boundary: true
      notes: "ต้องไม่ match คำว่า JavaScript — ใช้ word boundary เท่านั้น"

  - id: c_sharp
    canonical: "C#"
    category: language
    aliases: [csharp, "c sharp", "dotnet c#"]

  - id: go
    canonical: Go
    category: language
    aliases: [golang]
    match:
      requires_context: [skills_section, adjacent_tech]
      notes: >
        'go' เดี่ยว ๆ เป็นคำกริยาภาษาอังกฤษทั่วไป ("go to market")
        ถ้าเขียน 'golang' ถือว่าชัดเจน ไม่ต้องมีเงื่อนไข
        ถ้าเขียน 'Go' ในหัวข้อ Skills หรืออยู่ติดกับ token เทคนิค → นับได้
        นอกนั้น → skills_uncertain

  - id: rust
    canonical: Rust
    category: language

  - id: r_lang
    canonical: R
    category: language
    match:
      requires_context: [skills_section, adjacent_tech, uppercase_exact]
      notes: >
        กรณีที่ยากที่สุดใน taxonomy นี้ — ตัวอักษรเดียว
        ยอมรับเฉพาะเมื่ออยู่ในหัวข้อ Skills และเป็นตัวพิมพ์ใหญ่
        หรืออยู่ในรายการติดกับภาษาอื่น เช่น "R, Python, SAS"
        ถ้าไม่เข้าเงื่อนไข → skills_uncertain เสมอ ห้ามเดา

  - id: php
    canonical: PHP
    category: language

  - id: bash
    canonical: Bash
    category: language
    aliases: ["shell scripting", "shell script", "unix shell"]
    related: [linux]

  - id: html
