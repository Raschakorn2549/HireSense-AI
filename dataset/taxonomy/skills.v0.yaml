  - id: js_abbrev
    canonical: JavaScript
    category: language
    aliases: [js]
    match:
      requires_context: [skills_section, adjacent_tech]
      notes: >
        'JS' map ไปที่ javascript ได้เมื่อบริบทชัด
        รายการนี้แยกจาก javascript เพื่อให้เงื่อนไขบริบทผูกกับคำย่อเท่านั้น
        ตอน normalize ให้รวมผลเป็น id javascript

